<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Login & Galeria de fotos</h1>
    </header>
    <section>
        <div class="formularioLogin">
            <!--Input nome do Usuário-->
            <label class="form-label" for="usuario">Usuário</label>
            <input class="form-input" type="text" id="usuario" name="usuario">

            <!--Input senha do usuário-->
            <label class="form-label" for="senha">Senha</label>
            <input class="form-input" type="password" id="senha" name="senha">

            <!--Botão para verificar credenciais e efetuar login-->
            <input style="margin-top: 20px;" type="button" value="Entrar" class="form-input"
                onclick="verificarCredenciais()">
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
